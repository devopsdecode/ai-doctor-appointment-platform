#cloud-config

# ==============================================================================
# Cloud-Init for Azure GitHub Self-Hosted Runner VM
# ==============================================================================

# User Management: Dedicated Linux user for running the GitHub Actions service
users:
  - default
  - name: ${runner_user}
    gecos: GitHub Actions Runner Service User
    primary_group: ${runner_user}
    groups: [docker, sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    homedir: /home/${runner_user}

package_update: true
package_upgrade: false

# Core Prerequisites
packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - software-properties-common
  - git
  - jq
  - unzip
  - zip
  - tar
  - build-essential
  - libssl-dev
  - libffi-dev
  - libicu-dev
  - libkrb5-3
  - zlib1g

write_files:
  # ----------------------------------------------------------------------------
  # Helper Script: register-runner
  # Secure, interactive or non-interactive registration using short-lived tokens
  # ----------------------------------------------------------------------------
  - path: /usr/local/bin/register-runner
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      RUNNER_DIR="/actions-runner"
      RUNNER_USER="${runner_user}"
      DEFAULT_LABELS="self-hosted,linux,azure,docker"
      DEFAULT_NAME="$(hostname)"

      REPO_URL=""
      TOKEN=""
      RUNNER_NAME="$DEFAULT_NAME"
      RUNNER_LABELS="$DEFAULT_LABELS"

      usage() {
        echo "Usage: sudo register-runner --url <REPO_OR_ORG_URL> --token <REGISTRATION_TOKEN> [OPTIONS]"
        echo ""
        echo "Options:"
        echo "  --url <url>         GitHub Repository or Organization URL (Required)"
        echo "  --token <token>     Short-lived runner registration token from GitHub (Required)"
        echo "  --name <name>       Runner name (Default: $(hostname))"
        echo "  --labels <labels>   Comma-separated labels (Default: self-hosted,linux,azure,docker)"
        echo "  -h, --help          Show this help message"
        exit 1
      }

      while [[ $# -gt 0 ]]; do
        case "$1" in
          --url)
            REPO_URL="$2"
            shift 2
            ;;
          --token)
            TOKEN="$2"
            shift 2
            ;;
          --name)
            RUNNER_NAME="$2"
            shift 2
            ;;
          --labels)
            RUNNER_LABELS="$2"
            shift 2
            ;;
          -h|--help)
            usage
            ;;
          *)
            echo "Unknown parameter: $1"
            usage
            ;;
        esac
      done

      if [[ -z "$REPO_URL" ]]; then
        read -r -p "Enter GitHub Repository or Organization URL: " REPO_URL
      fi

      if [[ -z "$TOKEN" ]]; then
        read -r -s -p "Enter short-lived Runner Registration Token: " TOKEN
        echo ""
      fi

      if [[ -z "$REPO_URL" || -z "$TOKEN" ]]; then
        echo "ERROR: Both URL and Registration Token are strictly required."
        exit 1
      fi

      echo "================================================================="
      echo "Registering GitHub Actions Self-Hosted Runner..."
      echo "Target: $REPO_URL"
      echo "Runner Name: $RUNNER_NAME"
      echo "Labels: $RUNNER_LABELS"
      echo "================================================================="

      cd "$RUNNER_DIR"

      # Configure the runner as the dedicated user
      su - "$RUNNER_USER" -c "cd $RUNNER_DIR && ./config.sh \
        --url '$REPO_URL' \
        --token '$TOKEN' \
        --name '$RUNNER_NAME' \
        --labels '$RUNNER_LABELS' \
        --work '_work' \
        --unattended \
        --replace"

      # Install and start as a systemd service
      echo "Installing runner as a systemd service..."
      ./svc.sh install "$RUNNER_USER"
      echo "Starting systemd runner service..."
      ./svc.sh start
      echo "Verifying service status..."
      ./svc.sh status

      echo "================================================================="
      echo "SUCCESS: GitHub Runner registered and running as a systemd service!"
      echo "Check status in GitHub repository -> Settings -> Actions -> Runners."
      echo "================================================================="

  # ----------------------------------------------------------------------------
  # Helper Script: unregister-runner
  # Safely stops service and unregisters the runner
  # ----------------------------------------------------------------------------
  - path: /usr/local/bin/unregister-runner
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      RUNNER_DIR="/actions-runner"
      RUNNER_USER="${runner_user}"

      if [[ $# -lt 1 ]]; then
        read -r -s -p "Enter GitHub Runner Removal Token: " REMOVAL_TOKEN
        echo ""
      else
        REMOVAL_TOKEN="$1"
      fi

      cd "$RUNNER_DIR"
      echo "Stopping and uninstalling runner systemd service..."
      ./svc.sh stop || true
      ./svc.sh uninstall || true

      echo "Removing runner registration from GitHub..."
      su - "$RUNNER_USER" -c "cd $RUNNER_DIR && ./config.sh remove --token '$REMOVAL_TOKEN'"
      echo "Runner successfully removed."

  # ----------------------------------------------------------------------------
  # Welcome MOTD Banner with Instructions
  # ----------------------------------------------------------------------------
  - path: /etc/update-motd.d/99-github-runner
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      echo ""
      echo "================================================================================"
      echo "   Azure GitHub Actions Self-Hosted Runner VM (Terraform Provisioned)           "
      echo "================================================================================"
      echo " Docker:     $(docker --version 2>/dev/null || echo 'Installing...')"
      echo " Azure CLI:  $(az --version 2>/dev/null | head -n 1 || echo 'Installing...')"
      echo " kubectl:    $(kubectl version --client --output=yaml 2>/dev/null | grep gitVersion | awk '{print $2}' || echo 'Installing...')"
      echo " Helm:       $(helm version --short 2>/dev/null || echo 'Installing...')"
      echo " Runner Dir: /actions-runner"
      echo " User:       ${runner_user}"
      echo ""
      echo " To complete runner registration using a short-lived GitHub token:"
      echo "   sudo register-runner --url https://github.com/<org>/<repo> --token <TOKEN>"
      echo "================================================================================"
      echo ""

# Execution commands during cloud-init bootstrapping
runcmd:
  # 1. Prepare Docker apt repository & install Docker Engine
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable docker
  - systemctl start docker

  # 2. Configure Docker permissions for github-runner and azureuser
  - groupadd -f docker
  - usermod -aG docker ${runner_user}
  - usermod -aG docker azureuser || true

  # 3. Install Azure CLI
  - curl -sL https://aka.ms/InstallAzureCLIDeb | bash

  # 4. Install kubectl
  - mkdir -p /etc/apt/keyrings
  - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  - chmod 644 /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  - echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /" | tee /etc/apt/sources.list.d/kubernetes.list
  - apt-get update
  - apt-get install -y kubectl

  # 5. Install Helm (v3)
  - curl -fsSL -o /tmp/get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
  - chmod 700 /tmp/get_helm.sh
  - /tmp/get_helm.sh
  - rm -f /tmp/get_helm.sh

  # 6. Download and prepare GitHub Actions Runner
  - mkdir -p /actions-runner
  - cd /actions-runner
  - curl -o actions-runner-linux-x64-${runner_version}.tar.gz -L https://github.com/actions/runner/releases/download/v${runner_version}/actions-runner-linux-x64-${runner_version}.tar.gz
  - tar xzf ./actions-runner-linux-x64-${runner_version}.tar.gz
  - rm -f actions-runner-linux-x64-${runner_version}.tar.gz
  - ./bin/installdependencies.sh
  - chown -R ${runner_user}:${runner_user} /actions-runner

  # 7. Verification log
  - echo "Bootstrap completed successfully at $(date -u)" > /actions-runner/READY.txt
