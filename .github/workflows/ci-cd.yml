name: CI/CD Pipeline - Self-Hosted Azure Runner

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_SUBSCRIPTION_ID: "cd459aae-8e9d-4069-8ab8-fd60d11b3e04"
  ACR_NAME: "myacrprod"                          # Replace with your ACR name
  IMAGE_NAME: "sample-nodejs-app"
  AKS_RESOURCE_GROUP: "rg-aks-prod"              # Resource group where private AKS is located
  AKS_CLUSTER_NAME: "aks-cluster-prod"           # Name of your private AKS cluster
  DEPLOYMENT_NAME: "nodejs-deployment"
  NAMESPACE: "demo-app"

jobs:
  # ============================================================================
  # Continuous Integration (CI) Job
  # Executes directly on the self-hosted Azure Runner VM
  # ============================================================================
  ci:
    name: Build, Test, Scan & Push to ACR
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Environment & Tools
        run: |
          echo "=== Runner Host Info ==="
          hostname
          uname -a
          echo "=== Installed Tool Versions ==="
          docker --version
          az --version | head -n 1
          kubectl version --client --output=yaml | grep gitVersion
          helm version --short

      - name: Run Unit & Integration Tests
        run: |
          echo "Running application test suite inside containerized Node environment..."
          # Clean up container-generated node_modules on exit so host workspace permissions remain clean
          trap 'docker run --rm -v "$PWD":/usr/src/app alpine rm -rf /usr/src/app/node_modules' EXIT
          docker run --rm \
            -v "$PWD":/usr/src/app \
            -w /usr/src/app \
            node:20-alpine sh -c "npm ci && npm test"

      - name: Authenticate to Azure using VM Managed Identity
        run: |
          echo "Authenticating via System-Assigned Managed Identity..."
          az login --identity --allow-no-subscriptions
          echo "Setting active Azure subscription to $AZURE_SUBSCRIPTION_ID..."
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          echo "Authentication successful! Active subscription:"
          az account show --output table

      - name: Log in to Azure Container Registry (ACR)
        run: |
          echo "Logging into ACR: $ACR_NAME (Subscription: $AZURE_SUBSCRIPTION_ID)..."
          az acr login --name "$ACR_NAME" --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Build Node.js Docker Image
        run: |
          IMAGE_TAG="$GITHUB_SHA"
          ACR_REGISTRY="$ACR_NAME.azurecr.io"
          FULL_IMAGE="$ACR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
          LATEST_IMAGE="$ACR_REGISTRY/$IMAGE_NAME:latest"

          echo "Building production Docker image: $FULL_IMAGE..."
          docker build -t "$FULL_IMAGE" -t "$LATEST_IMAGE" .

      - name: Security Vulnerability Scan (Trivy)
        run: |
          echo "Scanning image for critical vulnerabilities using Trivy container..."
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            "$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA" || true

      - name: Push Docker Image to ACR
        run: |
          echo "Pushing image to Azure Container Registry..."
          docker push "$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA"
          docker push "$ACR_NAME.azurecr.io/$IMAGE_NAME:latest"
          echo "Image successfully published to ACR!"

      - name: Cleanup Workspace Permissions
        if: always()
        run: |
          echo "Ensuring all container-generated files are removed from workspace..."
          docker run --rm -v "$PWD":/usr/src/app alpine rm -rf /usr/src/app/node_modules 2>/dev/null || sudo rm -rf node_modules 2>/dev/null || true

  # ============================================================================
  # Continuous Deployment (CD) Job
  # Deploys to Private AKS cluster through peered VNet / Private DNS
  # ============================================================================
  cd:
    name: Deploy to Private AKS Cluster
    needs: [ci]
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Azure using VM Managed Identity
        run: |
          az login --identity --allow-no-subscriptions
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Get Private AKS Cluster Credentials
        run: |
          echo "Fetching kubeconfig for private AKS cluster: $AKS_CLUSTER_NAME (Subscription: $AZURE_SUBSCRIPTION_ID)..."
          az aks get-credentials \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --overwrite-existing

      - name: Verify TCP 443 Connectivity to Private AKS API
        run: |
          echo "Testing connectivity to Private Kubernetes API server..."
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: Deploy Kubernetes Manifests to Private AKS
        run: |
          IMAGE_URI="$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA"
          echo "Deploying application to namespace: $NAMESPACE with image: $IMAGE_URI..."

          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          
          # Dynamically set image tag on deployment manifest and apply
          sed -i.bak "s|image: .*|image: $IMAGE_URI|g" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Verify Kubernetes Rollout Status
        run: |
          echo "Verifying deployment rollout status in namespace: $NAMESPACE..."
          kubectl rollout status deployment/"$DEPLOYMENT_NAME" -n "$NAMESPACE" --timeout=180s

          echo "Deployment succeeded. Current pods and service:"
          kubectl get pods -n "$NAMESPACE" -l app="$IMAGE_NAME" -o wide
          kubectl get svc -n "$NAMESPACE"
