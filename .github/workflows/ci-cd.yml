name: CI/CD Pipeline - Self-Hosted Azure Runner

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_SUBSCRIPTION_ID: "cd459aae-8e9d-4069-8ab8-fd60d11b3e04"
  ACR_NAME: "myacrprod"                          # Replace with your ACR name
  IMAGE_NAME: "sample-nodejs-app"
  AKS_RESOURCE_GROUP: "rg-aks-prod"              # Resource group where private AKS is located
  AKS_CLUSTER_NAME: "aks-cluster-prod"           # Name of your private AKS cluster
  DEPLOYMENT_NAME: "nodejs-deployment"
  NAMESPACE: "demo-app"

jobs:
  # ============================================================================
  # Continuous Integration (CI) Job
  # Executes directly on the self-hosted Azure Runner VM
  # ============================================================================
  ci:
    name: Build, Test, Scan & Push to ACR
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Environment & Tools
        run: |
          echo "=== Runner Host Info ==="
          hostname
          uname -a
          echo "=== Installed Tool Versions ==="
          docker --version
          az --version | head -n 1
          kubectl version --client --output=yaml | grep gitVersion
          helm version --short

      - name: Run Unit & Integration Tests
        run: |
          echo "Running application test suite inside containerized Node environment..."
          # Clean up container-generated node_modules on exit so host workspace permissions remain clean
          trap 'docker run --rm -v "$PWD":/usr/src/app alpine rm -rf /usr/src/app/node_modules' EXIT
          docker run --rm \
            -v "$PWD":/usr/src/app \
            -w /usr/src/app \
            node:20-alpine sh -c "npm ci && npm test"

      - name: Build Node.js Docker Image
        run: |
          IMAGE_TAG="$GITHUB_SHA"
          ACR_REGISTRY="$ACR_NAME.azurecr.io"
          FULL_IMAGE="$ACR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
          LATEST_IMAGE="$ACR_REGISTRY/$IMAGE_NAME:latest"

          echo "Building production Docker image: $FULL_IMAGE..."
          docker build -t "$FULL_IMAGE" -t "$LATEST_IMAGE" .
          echo "Docker image built successfully!"

      - name: Security Vulnerability Scan (Trivy)
        run: |
          echo "Scanning image for critical vulnerabilities using Trivy container..."
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            "$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA" || true

      - name: Authenticate to Azure & Push Image to ACR
        run: |
          echo "Authenticating via System-Assigned Managed Identity..."
          if az login --identity --allow-no-subscriptions >/dev/null 2>&1; then
            echo "Managed Identity authenticated. Setting subscription: $AZURE_SUBSCRIPTION_ID..."
            az account set --subscription "$AZURE_SUBSCRIPTION_ID" 2>/dev/null || true

            # Check if ACR exists in subscription before attempting login & push
            if az acr show --name "$ACR_NAME" --subscription "$AZURE_SUBSCRIPTION_ID" >/dev/null 2>&1; then
              echo "ACR '$ACR_NAME' found. Logging in and pushing image..."
              az acr login --name "$ACR_NAME" --subscription "$AZURE_SUBSCRIPTION_ID"
              docker push "$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA"
              docker push "$ACR_NAME.azurecr.io/$IMAGE_NAME:latest"
              echo "Image successfully published to ACR!"
            else
              echo "::warning::ACR '$ACR_NAME' does not exist yet in subscription $AZURE_SUBSCRIPTION_ID. Skipping push until ACR is provisioned."
            fi
          else
            echo "::warning::Azure Managed Identity authentication skipped or not available. Image built locally."
          fi

      - name: Cleanup Workspace Permissions
        if: always()
        run: |
          echo "Ensuring all container-generated files are removed from workspace..."
          docker run --rm -v "$PWD":/usr/src/app alpine rm -rf /usr/src/app/node_modules 2>/dev/null || sudo rm -rf node_modules 2>/dev/null || true

  # ============================================================================
  # Continuous Deployment (CD) Job
  # Deploys to Kubernetes cluster
  # ============================================================================
  cd:
    name: Deploy to Kubernetes Cluster
    needs: [ci]
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate & Deploy to AKS
        run: |
          echo "Checking Azure credentials and AKS cluster status..."
          if az login --identity --allow-no-subscriptions >/dev/null 2>&1; then
            az account set --subscription "$AZURE_SUBSCRIPTION_ID" 2>/dev/null || true

            if az aks show --resource-group "$AKS_RESOURCE_GROUP" --name "$AKS_CLUSTER_NAME" --subscription "$AZURE_SUBSCRIPTION_ID" >/dev/null 2>&1; then
              echo "Fetching kubeconfig for AKS cluster: $AKS_CLUSTER_NAME..."
              az aks get-credentials \
                --subscription "$AZURE_SUBSCRIPTION_ID" \
                --resource-group "$AKS_RESOURCE_GROUP" \
                --name "$AKS_CLUSTER_NAME" \
                --overwrite-existing

              echo "Applying Kubernetes manifests to cluster..."
              IMAGE_URI="$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA"
              kubectl apply -f k8s/namespace.yaml
              kubectl apply -f k8s/configmap.yaml
              sed -i.bak "s|image: .*|image: $IMAGE_URI|g" k8s/deployment.yaml 2>/dev/null || true
              kubectl apply -f k8s/deployment.yaml
              kubectl apply -f k8s/service.yaml
              kubectl apply -f k8s/hpa.yaml
              echo "Deployment applied successfully!"
            else
              echo "::warning::AKS cluster '$AKS_CLUSTER_NAME' not found in '$AKS_RESOURCE_GROUP'. Skipping rollout until cluster is provisioned."
            fi
          else
            echo "::warning::Azure authentication not available. Skipping Kubernetes deployment."
          fi
