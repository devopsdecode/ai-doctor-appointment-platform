name: CI/CD Pipeline - Self-Hosted Azure Runner

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_SUBSCRIPTION_ID: "cd459aae-8e9d-4069-8ab8-fd60d11b3e04"
  IMAGE_NAME: "sample-nodejs-app"
  DEPLOYMENT_NAME: "nodejs-deployment"
  NAMESPACE: "demo-app"

jobs:
  # ============================================================================
  # 1. Infrastructure Provisioning Job (Terraform)
  # Automatically provisions Azure Resource Group, ACR, and AKS Cluster
  # ============================================================================
  terraform:
    name: Provision AKS Cluster & ACR (Terraform)
    runs-on: self-hosted
    outputs:
      acr_name: ${{ steps.export_outputs.outputs.acr_name }}
      aks_name: ${{ steps.export_outputs.outputs.aks_name }}
      rg_name: ${{ steps.export_outputs.outputs.rg_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Azure via Managed Identity
        run: |
          echo "Authenticating via System-Assigned Managed Identity..."
          az login --identity --allow-no-subscriptions
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          echo "Active subscription:"
          az account show --output table

      - name: Ensure Terraform is Installed
        run: |
          if ! command -v terraform >/dev/null 2>&1; then
            echo "Installing Terraform..."
            sudo apt-get update && sudo apt-get install -y gnupg software-properties-common wget
            wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
            sudo apt-get update && sudo apt-get install -y terraform
          fi
          terraform -version

      - name: Terraform Init & Apply
        working-directory: infrastructure/terraform
        run: |
          echo "Initializing Terraform..."
          terraform init
          echo "Applying Terraform configuration to provision ACR & AKS..."
          terraform apply -auto-approve

      - name: Export Infrastructure Outputs
        id: export_outputs
        working-directory: infrastructure/terraform
        run: |
          ACR=$(terraform output -raw acr_name)
          AKS=$(terraform output -raw aks_cluster_name)
          RG=$(terraform output -raw resource_group_name)
          echo "acr_name=$ACR" >> "$GITHUB_OUTPUT"
          echo "aks_name=$AKS" >> "$GITHUB_OUTPUT"
          echo "rg_name=$RG" >> "$GITHUB_OUTPUT"
          echo "=========================================="
          echo "Provisioned Infrastructure Details:"
          echo "Resource Group: $RG"
          echo "AKS Cluster:    $AKS"
          echo "ACR Registry:   $ACR"
          echo "=========================================="

  # ============================================================================
  # 2. Continuous Integration (CI) Job
  # Builds, tests, scans, and pushes Docker image to the provisioned ACR
  # ============================================================================
  ci:
    name: Build, Test, Scan & Push to ACR
    needs: [terraform]
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Environment & Tools
        run: |
          echo "=== Runner Host Info ==="
          hostname
          uname -a
          echo "=== Installed Tool Versions ==="
          docker --version
          az --version | head -n 1
          kubectl version --client --output=yaml | grep gitVersion
          helm version --short

      - name: Run Unit & Integration Tests
        run: |
          echo "Running application test suite inside containerized Node environment..."
          trap 'docker run --rm -v "$PWD":/usr/src/app alpine rm -rf /usr/src/app/node_modules' EXIT
          docker run --rm \
            -v "$PWD":/usr/src/app \
            -w /usr/src/app \
            node:20-alpine sh -c "npm ci && npm test"

      - name: Build Node.js Docker Image
        env:
          ACR_NAME: ${{ needs.terraform.outputs.acr_name }}
        run: |
          IMAGE_TAG="$GITHUB_SHA"
          ACR_REGISTRY="$ACR_NAME.azurecr.io"
          FULL_IMAGE="$ACR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
          LATEST_IMAGE="$ACR_REGISTRY/$IMAGE_NAME:latest"

          echo "Building production Docker image: $FULL_IMAGE..."
          docker build -t "$FULL_IMAGE" -t "$LATEST_IMAGE" .
          echo "Docker image built successfully!"

      - name: Security Vulnerability Scan (Trivy)
        env:
          ACR_NAME: ${{ needs.terraform.outputs.acr_name }}
        run: |
          echo "Scanning image for critical vulnerabilities using Trivy container..."
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            "$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA" || true

      - name: Push Docker Image to ACR
        env:
          ACR_NAME: ${{ needs.terraform.outputs.acr_name }}
        run: |
          echo "Authenticating via System-Assigned Managed Identity..."
          az login --identity --allow-no-subscriptions
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

          echo "Logging into provisioned ACR: $ACR_NAME..."
          az acr login --name "$ACR_NAME" --subscription "$AZURE_SUBSCRIPTION_ID"

          echo "Pushing image to Azure Container Registry..."
          docker push "$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA"
          docker push "$ACR_NAME.azurecr.io/$IMAGE_NAME:latest"
          echo "Image successfully published to ACR: $ACR_NAME"

      - name: Cleanup Workspace Permissions
        if: always()
        run: |
          echo "Ensuring all container-generated files are removed from workspace..."
          docker run --rm -v "$PWD":/usr/src/app alpine rm -rf /usr/src/app/node_modules 2>/dev/null || sudo rm -rf node_modules 2>/dev/null || true

  # ============================================================================
  # 3. Continuous Deployment (CD) Job
  # Connects to the provisioned AKS cluster and deploys Kubernetes manifests
  # ============================================================================
  cd:
    name: Deploy to Kubernetes Cluster (AKS)
    needs: [terraform, ci]
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    env:
      ACR_NAME: ${{ needs.terraform.outputs.acr_name }}
      AKS_CLUSTER_NAME: ${{ needs.terraform.outputs.aks_name }}
      AKS_RESOURCE_GROUP: ${{ needs.terraform.outputs.rg_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate & Deploy to AKS
        run: |
          echo "Authenticating to Azure via Managed Identity..."
          az login --identity --allow-no-subscriptions
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

          echo "Fetching kubeconfig for AKS cluster: $AKS_CLUSTER_NAME in $AKS_RESOURCE_GROUP..."
          az aks get-credentials \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --overwrite-existing

          echo "Testing connectivity to Kubernetes API server..."
          kubectl cluster-info
          kubectl get nodes -o wide

          echo "Applying Kubernetes manifests to cluster..."
          IMAGE_URI="$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA"
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          sed -i.bak "s|image: .*|image: $IMAGE_URI|g" k8s/deployment.yaml 2>/dev/null || true
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

          echo "Verifying deployment rollout status in namespace: $NAMESPACE..."
          kubectl rollout status deployment/"$DEPLOYMENT_NAME" -n "$NAMESPACE" --timeout=180s

          echo "Deployment succeeded! Current pods and services:"
          kubectl get pods -n "$NAMESPACE" -l app="$IMAGE_NAME" -o wide
          kubectl get svc -n "$NAMESPACE"
